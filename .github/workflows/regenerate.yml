# Chaque nuit, régénère les types depuis la spec publiée par la doc.
# Si elle a changé, ouvre une PR avec la version augmentée, ou complète celle
# qui est déjà ouverte sans effacer ce qui y a été ajouté à la main.
# Rien n'est publié ici : la publication part de publish.yml, à la fusion.
name: Mise à jour du schéma

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: auto/mise-a-jour-schema
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      # Une PR déjà ouverte : on repart de sa branche, à jour de main, pour
      # garder les ajouts faits à la main. Sinon, on part de main.
      - name: Choisir la branche de travail
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_version=$(node -p "require('./package.json').version")
          echo "main_version=$main_version" >> "$GITHUB_OUTPUT"
          # Seule compte la PR que cette tâche a ouverte depuis ce dépôt : une
          # PR venue d'une copie extérieure, sur une branche du même nom, est ignorée.
          number=$(gh pr list --head "$BRANCH" --state open --app github-actions \
            --json number,isCrossRepository,author \
            --jq '[.[] | select(.isCrossRepository == false and .author.login == "app/github-actions")][0].number // empty')
          if [ -n "$number" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "open_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$number" >> "$GITHUB_OUTPUT"
            git switch "$BRANCH"
            git merge --no-edit origin/main
          else
            echo "open_pr=false" >> "$GITHUB_OUTPUT"
            git switch -C "$BRANCH"
          fi

      - run: npm ci --ignore-scripts

      - name: Régénérer les types
        run: npm run generate

      - name: Comparer avec la branche de travail
        id: diff
        run: |
          if git diff --quiet -- src/generated/schema.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun écart avec la spec en ligne."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/generated/schema.ts
          fi

      # La version n'augmente qu'une fois par PR.
      - name: Augmenter la version
        if: steps.diff.outputs.changed == 'true'
        env:
          MAIN_VERSION: ${{ steps.branch.outputs.main_version }}
        run: |
          if [ "$(node -p "require('./package.json').version")" = "$MAIN_VERSION" ]; then
            npm version prerelease --preid beta --no-git-tag-version
          fi

      # Une compilation cassée (champ renommé ou retiré) ouvre quand même la
      # PR, signalée dans son titre ; la tâche finit ensuite en rouge.
      - name: Compiler
        if: steps.diff.outputs.changed == 'true'
        id: build
        run: |
          if npm run build > build.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat build.log
          fi

      - name: Pousser la branche et ouvrir la PR
        if: steps.diff.outputs.changed == 'true'
        env:
          OPEN_PR: ${{ steps.branch.outputs.open_pr }}
          PR_NUMBER: ${{ steps.branch.outputs.pr_number }}
          BUILD_OK: ${{ steps.build.outputs.ok }}
        run: |
          version=$(node -p "require('./package.json').version")
          git add package.json package-lock.json src/generated/schema.ts
          git commit -m "chore: régénérer le schéma depuis la doc en ligne ($version)"
          if [ "$OPEN_PR" = "true" ]; then
            git push origin "$BRANCH"
          else
            git push --force origin "$BRANCH"
          fi
          title="chore: régénérer le schéma depuis la doc en ligne ($version)"
          intro="Types régénérés depuis https://next.docs.stream.estate/openapi.json, version $version."
          if [ "$BUILD_OK" != "true" ]; then
            title="⚠️ compilation cassée — $title"
            intro="$intro

          **La compilation échoue** : un champ utilisé par \`src/index.ts\` a changé. Corriger \`src/index.ts\` sur cette branche avant de fusionner.

          \`\`\`
          $(tail -n 40 build.log)
          \`\`\`"
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' "$intro" \
            "À relire avant de fusionner : un champ renommé ou retiré casse le code des clients. Une nouvelle route demande une méthode écrite à la main dans src/index.ts." \
            "La fusion publie la version sur npm (publish.yml).")
          if [ "$OPEN_PR" = "true" ]; then
            gh pr edit "$PR_NUMBER" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
          if [ "$BUILD_OK" != "true" ]; then
            echo "::error::Compilation cassée : la PR est ouverte avec le journal."
            exit 1
          fi
